<style>
/* Layout: a calm intake form — one section per screen on a quiet page, progress as a thin rule. */
:root{
  --bg:#f3f5f4; --card:#ffffff; --ink:#18403a; --text:#1d2524; --muted:#5b6866; --line:#d7dfdc;
  --soft:#e8efec; --sel:#18403a; --sel-ink:#ffffff; --accent:#c9a227; --warn:#b4472f; --ok:#2c7a5a;
  --display:"Literata", Georgia, serif; --body:"Golos Text","Segoe UI",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101716; --card:#172120; --ink:#9fd3c4; --text:#e6eeec; --muted:#9aaba7; --line:#2a3836;
  --soft:#1f2c2a; --sel:#9fd3c4; --sel-ink:#0f1716; --accent:#e2c15a; --warn:#ff8a70; --ok:#6fd0a3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101716; --card:#172120; --ink:#9fd3c4; --text:#e6eeec; --muted:#9aaba7; --line:#2a3836;
  --soft:#1f2c2a; --sel:#9fd3c4; --sel-ink:#0f1716; --accent:#e2c15a; --warn:#ff8a70; --ok:#6fd0a3; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:auto}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink);width:0;transition:width .35s ease}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 28px;display:flex;flex-direction:column;gap:22px}
h1,h2{font-family:var(--display);color:var(--ink);margin:0;line-height:1.2;text-wrap:balance;font-weight:600}
h1{font-size:clamp(28px,6vw,38px)} h2{font-size:clamp(22px,4.8vw,28px)}
p{margin:0} .lead{color:var(--muted)}
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.q{font-weight:600}
.hint{font-size:14px;color:var(--muted)}
input[type=text],textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%}
textarea{min-height:120px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:1px;border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;color:var(--text);background:var(--soft);border:1px solid transparent;border-radius:999px;padding:8px 14px;cursor:pointer}
.chip:hover{border-color:var(--line)}
.chip[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);font-weight:600}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 16px;cursor:pointer;display:flex;gap:12px;align-items:center}
.opt:hover{border-color:var(--ink)}
.opt[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.opt .k{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:16px}
.opt[aria-pressed="true"] .k{color:var(--sel-ink)}
.idk{border-style:dashed}
.levels{display:grid;gap:8px}
.levels .opt{flex-direction:column;align-items:flex-start;gap:2px}
.levels .opt small{font-size:14px;opacity:.8}
.cando{display:flex;flex-direction:column;gap:14px}
.cando .row{display:flex;flex-direction:column;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.cando .row:last-child{border-bottom:0;padding-bottom:0}
.cando .chip{flex:1;text-align:center}
.sentence{font-family:var(--display);font-size:clamp(18px,4.6vw,22px);background:var(--bg);border-left:3px solid var(--accent);border-radius:4px;padding:14px 16px;overflow-wrap:anywhere}
.qnum{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;font-size:16px;border:1px solid var(--ink);border-radius:10px;padding:13px 22px;cursor:pointer;background:var(--ink);color:var(--card)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:focus-visible,.chip:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--warn);font-size:14px;font-weight:600}
.facts{display:grid;gap:10px;padding:0;margin:0;list-style:none}
.facts li{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:baseline}
.facts li span:first-child{font-family:var(--mono);font-size:13px;color:var(--ink);font-weight:600}
pre.report{font-family:var(--mono);font-size:13px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0;max-height:340px;overflow:auto;color:var(--text)}
.toast{font-weight:600;color:var(--ok);min-height:1.5em}
.foot{text-align:center;font-size:13px;color:var(--muted)}
@media (max-width:420px){.card{padding:24px 18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Level questionnaire additions: reading passage, listening player, Shadow card. */
.passage{font-family:var(--display);font-size:17px;line-height:1.65;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.passage p{margin:0}
.rq{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.play{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.play .btn{display:inline-flex;align-items:center;gap:10px}
.play .left{font-size:14px;color:var(--muted)}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--soft);border-radius:999px;padding:4px 10px;align-self:flex-start}
.shadow{background:var(--soft);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.shadow h3{margin:0;font-family:var(--display);color:var(--ink);font-size:20px}
.shadow ul{margin:0;padding-left:20px;display:grid;gap:6px}
.shadow a{color:var(--ink);font-weight:600}
.sendstate{font-weight:600}
.sendstate.ok{color:var(--ok)} .sendstate.bad{color:var(--warn)}
details.manual summary{cursor:pointer;color:var(--muted);font-size:14px}
details.manual[open]{display:flex;flex-direction:column;gap:12px}
</style>
</head>

  "When the small software company Brightline switched to a four-day week last year, the founders expected problems. Clients, they assumed, would complain about slower replies, and the team would simply squeeze five days of work into four and burn out.",

  {q:'"Squeeze five days of work into four" means…',o:['fit the work into less time, with difficulty','cancel one day of work','share the work with another team','get paid for five days'],a:0},

const EXP={"i've":'i have',"it's":'it is',"i'm":'i am',"don't":'do not',"you're":'you are',"we're":'we are',"can't":'can not',"cannot":'can not',"gotta":'got to',"gonna":'going to',"ok":'okay',"wanna":'want to'};
function words(s){return String(s||'').toLowerCase().replace(/[’`]/g,"'").replace(/[^a-z' ]+/g,' ').split(/\s+/).filter(Boolean).flatMap(w=>(EXP[w]||w).split(' ')).map(w=>w.replace(/'/g,''))}
function lcs(a,b){const d=Array(b.length+1).fill(0);for(let i=1;i<=a.length;i++){let prev=0;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=a[i-1]===b[j-1]?prev+1:Math.max(d[j],d[j-1]);prev=t}}return d[b.length]}
function heard(i){const c=(A.listen||{})[i];if(!c||c.none||!(c.text||'').trim())return 0;const t=words(LISTEN[i].t),u=words(c.text);return Math.round(lcs(t,u)/t.length*100)}

 TEST.forEach((t,i)=>{tot[t.lvl]++;const v=A['t'+i];if(v===undefined)return;asked++;if(v===-1)idk++;else if(v===t.a){score++;by[t.lvl]++}});
 let top=-1;for(let k=0;k<BANDS.length;k++){if(by[BANDS[k]]>=3)top=k;else break}
 const est=top<0?'A0–A1':top===BANDS.length-1?'C1+':BANDS[top]+'–'+BANDS[top+1];
 return {by,tot,score,idk,asked,est};
}
